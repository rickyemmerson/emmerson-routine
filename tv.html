<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Emmerson Routine · TV board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&amp;family=Fredoka:wght@600&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  :root { --display-font: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; }
  :root { --task-font: "DM Sans", system-ui, sans-serif; }
  body { margin: 0; background: #20192c; color: #faf6ff; font: 400 18px/1.35 var(--task-font); }
  main { max-width: 1920px; margin: auto; padding: 2.4vh 4.5vw 1.5vh; }
  header, .person, .group-title { display: flex; justify-content: space-between; align-items: baseline; gap: .7rem; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-family: var(--display-font); font-size: 4vw; font-size: clamp(23px, min(4.2vw, 5.6vh), 68px); font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }
  h1::after { content: ''; display: inline-block; width: .44em; height: .44em; margin-left: .38em; vertical-align: .18em; background: #ffd67b; clip-path: polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%); }
  #date, footer { color: #ded0ec; font-size: clamp(13px, min(1.65vw, 2.4vh), 28px); }
  header { margin-bottom: 2vh; }
  #board-frame { display: flow-root; }
  #board-frame.fitted-frame { overflow: hidden; }
  #board { display: flex; justify-content: space-between; align-items: stretch; }
  #board.fitted { transform-origin: top center; }
  section { width: 48.25%; min-width: 0; border-radius: 14px; background: #fff5f7; color: #421729; overflow: hidden; }
  section + section { background: #f5efff; color: #30194e; }
  .person { align-items: center; position: relative; overflow: hidden; padding: 1.25vh 2.25vw; color: #421729; background: #ffabc8; }
  section + section .person { color: #30194e; background: #c6b4ff; }
  .person::before, .person::after { content: ''; position: absolute; pointer-events: none; height: 1.1vh; border-radius: 50%; transform: rotate(-28deg); }
  .person::before { width: 3.6vh; left: 47%; top: 23%; background: #fff2a8; box-shadow: 2.8vh 3.5vh 0 #dc5b8c; }
  .person::after { width: 2.2vh; left: 53%; bottom: 21%; background: #fff6fb; }
  section + section .person::before { background: #d9f7a9; box-shadow: 2.8vh 3.5vh 0 #9975db; }
  h2 { position: relative; font-family: var(--display-font); font-size: clamp(22px, min(4vw, 5.8vh), 75px); font-weight: 600; letter-spacing: -.015em; line-height: 1.05; }
  .points { position: relative; display: flex; align-items: center; gap: .65em; padding: .45vh .65em; border: 1px solid #ffffff75; border-radius: 10px; background: #ffffff70; font-size: clamp(12px, min(1.3vw, 2.1vh), 25px); line-height: 1.15; }
  .points strong { font: 600 1.9em/1 var(--display-font); font-variant-numeric: tabular-nums; }
  .points strong::after { content: ''; display: inline-block; width: .29em; height: .29em; margin-left: .28em; vertical-align: .27em; border-radius: 2px; background: currentColor; transform: rotate(45deg); }
  .groups { padding: .55vh 2.25vw 1.35vh; }
  .group-title { margin-top: .85vh; padding: .44vh .65em; border-radius: 5px; background: #fae6b5; color: #4d3415; font-family: var(--display-font); font-size: clamp(13px, min(1.55vw, 2.5vh), 30px); font-weight: 600; line-height: 1.2; }
  .group-1 { background: #dcecd7; color: #274531; }
  .group-2 { background: #e6def5; color: #43285f; }
  .group-3 { background: #f5dce9; color: #632e51; }
  .group-title span { font: 400 .86em/1.2 var(--task-font); text-align: right; }
  .group-name { display: inline-flex; align-items: center; gap: .5em; }
  .group-name::before { content: ''; flex: 0 0 .63em; width: .63em; height: .63em; border-radius: 50%; background: #95600c; }
  .group-1 .group-name::before { border-radius: 2px; background: #397251; transform: rotate(-12deg); }
  .group-2 .group-name::before { background: transparent; box-shadow: inset .22em -.12em #694797; transform: rotate(-20deg); }
  .group-3 .group-name::before { border-radius: 2px; background: #94416a; transform: rotate(45deg); }
  ol { padding: 0; margin: 0; list-style: none; }
  li { display: flex; align-items: center; gap: .7em; padding: .42vh .65em; font-size: 2.2vh; font-size: clamp(12px, min(1.55vw, 2.28vh), 31px); line-height: 1.3; }
  li:nth-child(odd) { background: #fffdfd; }
  section + section li:nth-child(odd) { background: #fcfaff; }
  #board.morning li { padding-block: .85vh; font-size: clamp(15px, min(2.45vw, 4.2vh), 45px); }
  #board.later li { padding-block: .26vh; font-size: clamp(12px, min(1.45vw, 2.1vh), 30px); }
  .bonus-list { display:flex; flex-wrap:wrap; }
  #board .bonus-list li { width: 33.33%; padding: .32vh .4em; gap: .4em; font-size: clamp(11px, min(1.15vw, 1.8vh), 24px); }
  .label { min-width: 0; overflow-wrap: break-word; overflow-wrap: anywhere; }
  .mark { width: .65em; height: .65em; flex: 0 0 .65em; border: 1px solid currentColor; border-radius: 3px; }
  .done .mark { background: #256343; border-color: #256343; }
  .done .mark::after { content: ''; display: block; width: .24em; height: .4em; margin: -.03em auto 0; border: solid white; border-width: 0 .08em .08em 0; transform: rotate(45deg); }
  .done .label { text-decoration: line-through; }
  .task-time { margin-left: auto; padding-left: .3em; text-align: right; font-size: .76em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  footer { margin-top: 1.4vh; }
  @media (orientation: portrait) and (max-width: 590px) {
    #board { display: block; }
    section { width: 100%; margin-bottom: 1rem; }
    header { display: block; }
    li { font-size: 16px; }
  }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Today’s jobs</h1><p id="date"></p></header>
  <div id="board-frame"><div id="board"></div></div>
  <footer id="status" role="status">Connecting to the jobs board…</footer>
  <noscript>The TV browser needs JavaScript enabled to show the jobs board.</noscript>
</main>
<script src="routine-tasks.js?v=bed830"></script>
<script>
(function () {
  'use strict';
  var periods = ['morning', 'school', 'dinner', 'bonus'];
  var dueTimes = {morning:'07:45',school:'18:00',dinner:'20:00'};
  var weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var snapshot = null;
  var lastRender = '';
  var connection = 'Connecting to the jobs board…';
  var refreshTimer;
  var requestInFlight = false;
  var endpoint = 'https://lfwxbxrsureqdlxjlfgf.supabase.co/rest/v1/routine_tv?select=day,board,jobs';
  function brisbane() {
    return new Date(Date.now() + 10 * 60 * 60 * 1000);
  }
  function element(tag, text, className) {
    var node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  function fitBoard() {
    var frame = document.getElementById('board-frame');
    var board = document.getElementById('board');
    board.classList.remove('fitted');
    board.style.transform = '';
    frame.classList.remove('fitted-frame');
    frame.style.height = '';

    // Keep natural scrolling on portrait phones. On a TV, reserve space for
    // the heading and connection status, then fit both checklists as a unit.
    var viewport = document.documentElement;
    if (viewport.clientWidth < viewport.clientHeight) return;
    var footer = document.getElementById('status');
    var bottom = footer.offsetHeight + parseFloat(window.getComputedStyle(footer).marginTop);
    bottom += parseFloat(window.getComputedStyle(frame.parentNode).paddingBottom);
    var available = Math.floor(viewport.clientHeight - frame.getBoundingClientRect().top - bottom - 1);
    var height = board.getBoundingClientRect().height;
    if (available <= 0 || height <= available) return;

    var scale = available / height;
    board.classList.add('fitted');
    board.style.transform = 'scale(' + scale + ')';
    frame.style.height = available + 'px';
    // The unscaled box would otherwise still extend the page's scroll area.
    frame.classList.add('fitted-frame');
  }
  function render() {
    var now = brisbane(), day = now.toISOString().slice(0, 10), dow = now.getUTCDay();
    var morning = now.getUTCHours() < 12;
    var data = snapshot && snapshot.day === day ? snapshot.board : {};
    var ready = connection === 'Updates automatically' || Boolean(snapshot && snapshot.day === day);
    var overrides = snapshot ? snapshot.jobs : {};
    var key = JSON.stringify([day, morning, data, ready, overrides]);
    var status = document.getElementById('status');
    var statusChanged = status.textContent !== connection;
    if (statusChanged) status.textContent = connection;
    if (key === lastRender) {
      if (statusChanged) fitBoard();
      return;
    }
    lastRender = key;
    document.getElementById('title').textContent = morning ? 'Morning jobs' : 'Today’s jobs';
    document.getElementById('date').textContent = weekdays[dow] + ' · ' + now.getUTCDate() + '/' + (now.getUTCMonth() + 1);
    var board = document.getElementById('board');
    board.className = morning ? 'morning' : 'later';
    board.textContent = '';
    var catalogue = RoutineTasks.list(overrides);
    ['abby', 'olivia'].forEach(function (girl) {
      var person = data[girl] || {}, states = person.tasks || {};
      var panel = element('section');
      var heading = element('div', '', 'person');
      heading.appendChild(element('h2', girl === 'abby' ? 'Abby' : 'Olivia'));
      var points = element('p', '', 'points');
      var score = ready ? (typeof person.points === 'number' ? person.points : 0) : '—';
      points.appendChild(element('strong', String(score)));
      points.appendChild(element('span', 'Points today'));
      heading.appendChild(points);
      panel.appendChild(heading);
      var content = element('div', '', 'groups');
      (morning ? ['morning', 'bonus'] : periods).forEach(function (period) {
        var assigned = catalogue.filter(function (task) {
          return task.group === period && (morning || !task.morningOnly) && RoutineTasks.assigned(task, girl, dow);
        });
        if (!assigned.length) return;
        var index = periods.indexOf(period);
        var title = RoutineTasks.groups[period];
        var defaultDue = dueTimes[period];
        var deadline = assigned.some(function (task) { return task.due && task.due === defaultDue; }) ? RoutineTasks.time(defaultDue) : '';
        var groupTitle = element('h3', '', 'group-title group-' + index);
        groupTitle.appendChild(element('b', title, 'group-name'));
        if (deadline) groupTitle.appendChild(element('span', 'By ' + deadline));
        content.appendChild(groupTitle);
        var list = element('ol', '', period === 'bonus' ? 'bonus-list' : '');
        assigned.forEach(function (task) {
          var done = states[task.id] === 'done';
          var row = element('li', '', done ? 'done' : '');
          var mark = element('span', '', 'mark');
          mark.setAttribute('aria-hidden', 'true');
          row.appendChild(mark);
          row.appendChild(element('span', task.name, 'label'));
          row.appendChild(element('span', done ? ' (completed)' : ' (unchecked)', 'sr-only'));
          if (task.due && task.due !== defaultDue) row.appendChild(element('span', RoutineTasks.time(task.due), 'task-time'));
          list.appendChild(row);
        });
        content.appendChild(list);
      });
      panel.appendChild(content);
      board.appendChild(panel);
    });
    fitBoard();
  }
  function refresh() {
    clearTimeout(refreshTimer);
    if (requestInFlight || document.hidden) return;
    requestInFlight = true;
    var request = new XMLHttpRequest();
    request.open('GET', endpoint, true);
    request.setRequestHeader('apikey', 'sb_publishable_UVxQWE2KErQpNx_V1TYxbw_MsxaohKA');
    request.timeout = 10000;
    function finish(delay) {
      requestInFlight = false;
      render();
      refreshTimer = setTimeout(refresh, delay);
    }
    function unavailable() {
      connection = 'Connection interrupted · Retrying shortly';
      finish(5000);
    }
    request.onload = function () {
      try {
        if (request.status !== 200) return unavailable();
        var rows = JSON.parse(request.responseText);
        snapshot = rows[0] || null;
        connection = 'Updates automatically';
        finish(2000);
      } catch (error) { unavailable(); }
    };
    request.onerror = request.ontimeout = unavailable;
    request.send();
  }
  render();
  refresh();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearTimeout(refreshTimer);
    else { render(); refresh(); }
  });
  window.addEventListener('online', refresh);
  window.addEventListener('resize', fitBoard);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoard);
  setInterval(render, 1000);
})();
</script>
</body>
</html>
